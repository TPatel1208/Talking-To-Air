    - product/vertical_column_uncertainty
    - product/main_data_quality_flag
  supports_variable_subsetting: true
  units: molecules/cm^2
  fill_value: -1.0e+30
  # Retrieval noise scatters below zero over clean scenes (31% of TEMPO HCHO,
  # 25% of OMI HCHO finite pixels, measured 2026-08-02). Those are good-quality
  # observations, so the floor sits below the noise to catch corrupt values only,
  # rather than at 0.0 where it censored the low tail and biased the mean high.
  valid_min: -1.0e+17
  valid_max: .inf
