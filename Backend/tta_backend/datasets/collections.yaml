# Near Real-Time twin of TEMPO_NO2. The agent prompt tells the model to reach
# for an NRT product on any "recent/latest/today" request, and until this entry
# existed every such retrieval was UNREGISTERED -- which means no pinned rule,
# and (measured 2026-08-02: Tier-2 CF classification has never fired on a real
# product) therefore no quality masking at all. The flag was in the file the
# whole time; nothing pinned it. On the standard V04 twin that mask removes
# 26.6% of a scene, so the most-asked question was returning the least-masked
# answer the system could produce.
#
# Structure verified against Earthdata 2026-08-02: 39 bands including
# product/main_data_quality_flag, identical layout to V04.
#
# ASSUMPTION, not granule-verified: qa_good_values [0] carries over from V04 on
# the grounds that this is the same product family. If V02's flag vocabulary
# differs, this is where to look.
#
# Registered as its own key rather than folded into TEMPO_NO2 because the NRT
# stream is algorithm V02 against the standard stream's V04 -- silently mixing
# them in one timeseries would compare two different retrievals.
TEMPO_NO2_NRT:
  collection_id: C3685668637-LARC_CLOUD
  short_name: TEMPO_NO2_L3_NRT
  version: V02
  description: TEMPO tropospheric NO2 vertical column (Near Real-Time, V02)
  cadence: hourly
  provider: NASA LARC
  instrument: TEMPO
  primary_var: vertical_column_troposphere
  quality_flag_var: main_data_quality_flag
  qa_good_values: [0]
  variables:
    - product/vertical_column_troposphere
    - product/main_data_quality_flag
  supports_variable_subsetting: true
  units: molecules/cm^2
  fill_value: -1.0e+30
  valid_min: -1.0e+15
  valid_max:  1.0e+18
  groups:
    - product

