# ── Sulfur dioxide ───────────────────────────────────────────────────────────

# Fills the SO2 gap -- a criteria pollutant with no coverage until now. TEMPO
# publishes no SO2 product (Earthdata search returned only field campaigns,
# checked twice on 2026-08-02), so OMI is the option.
#
# Granule-verified 2026-08-02 (2025-06-15, North America, one granule):
#   QualityFlags_SO2  ValidRange [0, 2], MissingValue -2147483648, and NO CF
#                     flag_values/flag_meanings -- so it is an enumerated flag,
#                     not the bit mask first assumed, and Tier-2 CF parsing
#                     still cannot fire (0 for 5 real products now).
#   Observed          flag=0 on 57,508 cells and flag=1 on 53,288; the finite
#                     ColumnAmountSO2 count is 57,508 EXACTLY, so flag=0 is the
#                     retrieved class and flag=1 carries no data at all.
#   Value 2           never appears in the granule, so its meaning is inferred
#                     from the sibling OMI L3 product (OMI_HCHO, same GES DISC
#                     family) where 2 is bad_or_not_computed.
#
# qa_bad_values [2] is therefore the minimal-intervention pin: it matches the
# sibling convention and drops only the class never observed to carry data. On
# the verified granule either pin is a no-op -- everything outside flag=0 is
# already fill -- so this cannot silently destroy observations, and masking now
# reports "verified" instead of "semantics unknown".
#
# fill/valid bounds are the file's own: MissingValue -1.2676506e+30 and
# ValidRange [-10, 2000] DU. The floor is NOT zero -- 45.8% of finite values in
# the verified granule are negative (min -1.06 DU), the largest negative share
# of any product measured, so a zero floor would have destroyed nearly half.
#
# Two collections share the OMSO2e short name: C3756242136 is V004 (registered
# here) and C1266136112 is the superseded V003. Checked 2026-08-02 -- searching
# by short name alone returns both, so match on concept_id.
OMI_SO2:
  collection_id: C3756242136-GES_DISC
  short_name: OMSO2e
  version: "004"
  description: OMI total column SO2 daily global L3 (PCA algorithm, best pixel)
  cadence: daily
  provider: NASA GES DISC
  instrument: OMI/Aura
  primary_var: ColumnAmountSO2
  quality_flag_var: QualityFlags_SO2
  qa_bad_values: [2]
  variables: []
  supports_variable_subsetting: false
  units: DU
  fill_value: -1.2676506002282294e+30
  valid_min: -10.0
  valid_max:  2000.0
  groups:
    - HDFEOS/GRIDS/OMI_Total_Column_Amount_SO2/Data_Fields

