# The NRT aerosol product the agent prompt tells the model to reach for on a
# "recent/latest" AOD request. Granule-verified 2026-08-02 (2026-08-01, one
# granule) and it is the 432-variable collection behind the historical
# variable-resolution blowup -- confirmed exactly: 432 bands, 121 product
# groups, and only 4 distinct leaf names (Mean, Pixel_Counts,
# Standard_Deviation, Histogram_Counts), so leaves collide 121-deep.
#
# Despite the abstract's "single combined product" wording there is NO combined
# band: the 121 groups are platform x algorithm x QA-filter combinations (Aqua/
# Terra MODIS, SNPP/NOAA-20 VIIRS, NASA Dark Target vs Deep Blue vs NRL
# correction, QF3-filtered vs not, land vs ocean), plus aeronet_* ground truth.
#
# primary_var is therefore a CHOICE among 121, not a lookup, and pinning it is
# what keeps this collection out of the ambiguous-refusal path. The pin is
# NOAA-20 VIIRS NASA Deep Blue: current operational platform, standard NASA
# algorithm, and the best coverage in the verified granule (38,320 of 64,800
# cells, against 33,065 for NASA Dark Target and 9,415 for Aqua MODIS NRL).
# Deep Blue and Dark Target genuinely disagree over bright surfaces, so this is
# a disclosed scientific choice -- change it deliberately, not incidentally.
#
# fill/valid bounds measured from the granule: _FillValue -999.0, and the data
# is already clipped to [-0.05, 5.0] (observed exact min -0.050, max 5.000).
AERDA_AOD_NRT:
  collection_id: C3573648328-ASIPS
  short_name: AERDA_D3_VIIRS_MODIS_NRT
  version: "1"
  description: NRT VIIRS/MODIS combined AOD for data assimilation (24-hour, 1 degree)
  cadence: daily
  provider: NASA ASIPS
  instrument: VIIRS + MODIS
  primary_var: NOAA20_VIIRS_NASADeepBlue_AOD_550/Mean
  quality_flag_var: null
  variables: []
  supports_variable_subsetting: false
  units: AOD (550nm)
  fill_value: -999.0
  valid_min: -0.05
  valid_max:  5.0
  groups: []

# The 3-hourly cut of the same NRT assimilation product as AERDA_AOD_NRT --
# eight files a day instead of one, which is what makes it useful for tracking
# a smoke plume or an exceedance through a day rather than after it.
#
# Granule-verified 2026-08-02 (2026-08-01T00:00-06:00): structurally IDENTICAL
# to the 24-hour variant -- 432 bands, 121 groups, the same four colliding leaf
# names, the same NOAA20_VIIRS_NASADeepBlue_AOD_550/Mean band and the same
# -999.0 fill. Everything said about the daily entry's primary_var choice
# applies here unchanged, and a test pins the two to one treatment.
#
# CADENCE CAVEAT: this product is 3-hourly and the registry's cadence field
# only admits hourly/daily/monthly, so none of the three is exact. "hourly" is
# chosen because it is the only sub-daily option -- it keeps period labels off
# "Daily" (which would make this indistinguishable from the 24-hour sibling),
# and because _cadence_weighted_mean floors to the hour, an evenly-spaced
# 3-hourly series lands one granule per bucket and the weighting degenerates to
# the plain mean rather than distorting it. Marking it "daily" would instead
# pool eight granules into one bucket. Neither is the true 3-hour bucket;
# widening the cadence vocabulary is the real fix.
AERDA_AOD_NRT_3H:
  collection_id: C3573647939-ASIPS
  short_name: AERDA_L3_VIIRS_MODIS_NRT
  version: "1"
  description: NRT VIIRS/MODIS combined AOD for data assimilation (3-hour, 1 degree)
  cadence: hourly
  provider: NASA ASIPS
  instrument: VIIRS + MODIS
  primary_var: NOAA20_VIIRS_NASADeepBlue_AOD_550/Mean
  quality_flag_var: null
  variables: []
  supports_variable_subsetting: false
  units: AOD (550nm)
  fill_value: -999.0
  valid_min: -0.05
  valid_max:  5.0
  groups: []

