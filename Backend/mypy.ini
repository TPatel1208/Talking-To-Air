[mypy]
# Must match Backend/Dockerfile's base image, the CI setup-python version,
# ruff.toml's target-version and pyproject.toml's requires-python. This one
# also cannot go BELOW 3.12 regardless: numpy 2.x's bundled __init__.pyi uses
# PEP 695 `type` statements, which mypy refuses to parse under an older target
# ("Type statement is only supported in Python 3.12 and greater"), aborting the
# whole check on the first numpy import.
python_version = 3.12
ignore_missing_imports = true
follow_imports = silent
# CI checks all of tta_backend. Every error code that finds a wrong value
# (arg-type, assignment, return-value, call-arg, attr-defined, ...) is on
# everywhere. Switched off globally are only the annotation-completeness
# codes: ~500 unannotated defs and bare generics across the older packages,
# which say nothing about whether the code is right. They are back on below for
# the packages that are fully annotated, and a package joins that list once it
# passes them.
disable_error_code =
    no-any-return,
    no-untyped-call,
    no-untyped-def,
    type-arg,
    untyped-decorator,
    var-annotated

[mypy-tta_backend.services.*]
strict = true
enable_error_code = no-any-return, no-untyped-call, no-untyped-def, type-arg, untyped-decorator, var-annotated

[mypy-tta_backend.repositories.*]
strict = true
enable_error_code = no-any-return, no-untyped-call, no-untyped-def, type-arg, untyped-decorator, var-annotated

[mypy-tta_backend.models.*]
strict = true
enable_error_code = no-any-return, no-untyped-call, no-untyped-def, type-arg, untyped-decorator, var-annotated
