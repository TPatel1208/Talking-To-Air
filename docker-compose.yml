# ─────────────────────────────────────────────
#  Talking to Air — local Docker Compose stack
#
#  Usage:
#    cp .env.example .env        # fill in secrets
#    docker compose up --build   # first run
#    docker compose up           # subsequent runs
#    docker compose down -v      # stop + wipe volumes
# ─────────────────────────────────────────────

services:

  # ── PostgreSQL + PostGIS (conversation memory) ────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: tta-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: talking_to_air_memory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init_agent_charts.sql:/docker-entrypoint-initdb.d/01_agent_charts.sql:ro
      - ./sql/init_agent_artifacts.sql:/docker-entrypoint-initdb.d/02_agent_artifacts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talking_to_air_memory"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s       

  # ── FastAPI + LangChain backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: tta-backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: talking_to_air_memory
      DB_USER: postgres
      # Which peers uvicorn's --proxy-headers will believe about the client's
      # real address. Scoped to Docker's private bridge range, which is the
      # only hop in front of this service (nginx, in the frontend container).
      #
      # This is what makes per-IP rate limiting mean anything: without it the
      # default trusts 127.0.0.1 only, nginx connects from a bridge address,
      # X-Forwarded-For is discarded, and every request in the stack is
      # attributed to nginx -- one shared bucket for the whole userbase.
      #
      # Deliberately NOT "*". uvicorn walks the forwarded chain in reverse and
      # stops at the first peer it does not trust, so a narrow range yields the
      # real client even when the client sent its own X-Forwarded-For. With "*"
      # it takes the leftmost entry instead, which the client fully controls --
      # anyone could mint a fresh rate-limit bucket per request.
      #
      # The default is Docker's conventional pool, which is what this stack gets
      # on a stock daemon. It is overridable because the pool is configurable in
      # daemon.json: a host allocating from, say, 10.10.0.0/16 puts nginx outside
      # this range, uvicorn then drops X-Forwarded-For, and per-address limiting
      # silently collapses to one bucket for every anonymous visitor. api.py logs
      # a warning the first time it sees that happen, so the symptom is at least
      # findable; this is the knob that fixes it.
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-172.16.0.0/12}"
    ports:
      # Bound to loopback, not 0.0.0.0. nginx reaches this over the compose
      # network as backend:8000 and is unaffected; keeping the host mapping
      # means `curl localhost:8000` still works for debugging. Published on
      # 0.0.0.0 it was a way around the edge: nginx's limit_req only sees
      # traffic that goes through nginx, so anything on the LAN could skip
      # both it and the trusted-proxy path above by talking to :8000 directly.
      - "127.0.0.1:8000:8000"
    volumes:
      - plot_outputs:/app/outputs
      # Server-rendered map overlay PNGs (T23). Kept OUT of /app/outputs on
      # purpose (that dir is served unauthenticated at /outputs), so it needs
      # its own named volume — without one, a container recreate wipes every
      # overlay while its chart payload persists in Postgres, and the map
      # silently degrades to the canvas fallback ("quality lowered on restart").
      - overlay_store:/app/overlay_store
      # T52 Zarr cube cache — the open pipeline's output, keyed so it self-
      # invalidates. Backend-only and read-write, same posture as
      # overlay_store. Deliberately NOT a tempdir: a cube costs minutes to
      # build and this image is rebuilt constantly, so a tempdir store would
      # be empty every time you looked and would read as "the cache doesn't
      # help" rather than as a missing volume. Bounded by CUBE_STORE_MAX_BYTES,
      # not by free space.
      - cube_store:/app/cube_store
      # T59 frame blob store — the float32 stack behind a chart's time
      # scrubber. Its own volume rather than a corner of overlay_store, which
      # has no eviction policy and grows forever: an LRU sweeper sharing a
      # directory with an unbounded store would evict frames to make room for
      # PNGs that never leave. Bounded by FRAME_STORE_MAX_BYTES (1 GiB), not by
      # free space. Without a volume, a container recreate strips the scrubber
      # off every chart ever plotted while the frame axis persists in Postgres
      # and goes on advertising it — and D8 forbids rebuilding the blob.
      - frame_store:/app/frame_store
      # earthdata-retrieval MCP's materialization volume, read-only, mounted
      # at the same absolute path (/data) the MCP stack uses internally so
      # `export_result`'s file:// URIs resolve as a plain filesystem read.
      - earthdata_data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - earthdata_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Backend tests (pytest + coverage) ───────────────────────────────────────
  #  Run with: docker compose --profile test run --rm backend-test
  backend-test:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      # `devtools`, not `builder`: pytest/coverage live only in that stage so
      # they stay out of the runtime image's venv.
      target: devtools
    profiles: ["test"]
    working_dir: /app
    environment:
      SUPABASE_URL: "https://test-project.supabase.co"
      SUPABASE_PUBLISHABLE_KEY: "test-publishable-key"
      GROQ_API_KEY: "test"
      AQS_API_KEY: "test"
      AQS_API_EMAIL: "test@test.com"
      DB_HOST: "localhost"
      DB_PORT: "5432"
      DB_NAME: "talking_to_air_memory"
      DB_USER: "postgres"
      DB_PASSWORD: "test"
    volumes:
      # test_chart_repository.py's / test_artifact_repository.py's schema-contract
      # tests read these files straight off disk; they live at the repo root so
      # they're outside the ./Backend build context and must be bind-mounted in.
      - ./sql/init_agent_charts.sql:/sql/init_agent_charts.sql:ro
      - ./sql/init_agent_artifacts.sql:/sql/init_agent_artifacts.sql:ro
      # test_overlay_store_persistence.py asserts the deployment persists the
      # overlay store; the compose file is likewise outside the build context.
      - ./docker-compose.yml:/compose/docker-compose.yml:ro
      # The Python-reads-JS contract tests. Neither side can import the other,
      # so a concept living on both sides of the seam is enforced by reading the
      # literal out of the JS source: FinishedRowStatusContractTests against
      # jobCard.js's TERMINAL_STATUSES, and SharedDeltaThresholdTests (T59
      # Phase 8) against frameDelta.js's severityOf edge, which is the same
      # number as _DELTA_HIGH. Both resolve the file relative to Backend/tests,
      # so the mount lands at the absolute path that resolution produces in the
      # container and the same expression works on the host. ./Frontend is
      # outside the ./Backend build context, same as the two SQL files above —
      # and without this mount those tests fail on a missing file rather than on
      # a drift, which is exactly what jobCard.js's had been doing.
      - ./Frontend/src/utils:/Frontend/src/utils:ro
      # Same reason: .coveragerc is a repo-root file, so the image has never
      # contained it. Without it `coverage report` below ran unconfigured,
      # measured all of site-packages, and died on netCDF4's compiled extension
      # ("No source for code: /app/src/netCDF4/_netCDF4.pyx") -- so this service
      # exited 1 even when every test passed.
      - ./.coveragerc:/app/.coveragerc:ro
    command: >
      sh -c "coverage run -m pytest tests/ -v --tb=short && coverage report"

  # ── Frontend tests (Vitest) ───────────────────────────────────────────────────
  #  Run with: docker compose --profile test run --rm frontend-test
  frontend-test:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: builder
    profiles: ["test"]
    working_dir: /app
    command: ["npm", "test"]

  # ── React / Vite frontend (nginx) ────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: tta-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "443:443"
    volumes:
      - plot_outputs:/usr/share/nginx/html/outputs  # serves images directly from volume
    depends_on:
      backend:
        condition: service_healthy

# ── Networks ───────────────────────────────────────────────────────────────────
# Fixed name (not project-prefixed), created by the harmony-retrieval-mcp
# stack on its first `docker compose up`. Join it here as external so the
# backend can reach that stack's `mcp` service at $EARTHDATA_MCP_URL.
#
# T17: the backend no longer requires that stack to be up first (or ever, for
# ground/EPA-only use) — it boots regardless and connects to the MCP in the
# background with capped retry, healing without a restart once it's up. Bring
# up this stack and the harmony-retrieval-mcp stack in either order; see
# README.md.
networks:
  earthdata_net:
    external: true

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  pg_data:
    driver: local
  plot_outputs:
    driver: local
  overlay_store:
    driver: local
  cube_store:
    driver: local
  frame_store:
    driver: local
  # Owned by the harmony-retrieval-mcp stack (its `data` volume, fixed name
  # `earthdata_data`); joined here as external, read-only, so this stack is
  # not a second writer of materialized data.
  earthdata_data:
    external: true
