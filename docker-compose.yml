# ─────────────────────────────────────────────
#  Talking to Air — local Docker Compose stack
#
#  Usage:
#    cp .env.example .env        # fill in secrets
#    docker compose up --build   # first run
#    docker compose up           # subsequent runs
#    docker compose down -v      # stop + wipe volumes
# ─────────────────────────────────────────────

services:

  # ── PostgreSQL + PostGIS (conversation memory) ────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: tta-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: talking_to_air_memory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init_agent_charts.sql:/docker-entrypoint-initdb.d/01_agent_charts.sql:ro
      - ./sql/init_agent_artifacts.sql:/docker-entrypoint-initdb.d/02_agent_artifacts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talking_to_air_memory"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s       

  # ── FastAPI + LangChain backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    # Tagged so the thing that ran here is the thing that ships. Without an
    # `image:` compose names the build `<project>-backend`, which exists only in
    # the local daemon: there is no artifact to push, no digest to roll back to,
    # and a deploy elsewhere is a rebuild from whatever `main` happens to be at
    # the time. Defaults keep `docker compose up --build` working untouched --
    # compose builds when the tag is absent locally, so nothing tries to pull
    # `:dev` from a registry. CI overrides both vars and pushes; see
    # .github/workflows/release.yml and IMAGE_REGISTRY/IMAGE_TAG in .env.example.
    image: ${IMAGE_REGISTRY:-ghcr.io/tpatel1208}/tta-backend:${IMAGE_TAG:-dev}
    container_name: tta-backend
    restart: unless-stopped
    # The container's memory ceiling, and half of a two-part contract.
    #
    # Measured on the live stack 2026-09-01: /sys/fs/cgroup/memory.max read
    # "max" -- no limit at all. An overshoot was therefore the *host* OOM killer
    # choosing which container to kill, and nothing said it would choose this
    # one; a runaway chart render could take Postgres with it. A limit here
    # confines the blast radius to the container that caused it, and the
    # `restart: unless-stopped` above turns that into a recovery rather than an
    # outage.
    #
    # A ceiling on its own would make things WORSE, not better: it lowers the
    # point at which kills happen without doing anything to keep the process
    # underneath it. So this number is also handed to the backend below as
    # BACKEND_MEM_LIMIT_MB, which services/admission.py divides into a limit on
    # how many heavy reductions may hold memory at once. The two must denote the
    # same ceiling, and a deployment-contract test asserts they do -- they are
    # separate keys a reader would assume move together, and nothing else would
    # notice if they stopped.
    #
    # Overridable because one tracked file serves two very different machines:
    # the deployment target has 8 GiB, while a dev checkout measured 2026-09-01
    # caps its WSL VM at 4 GiB total for every container. That host sets
    # BACKEND_MEM_LIMIT=3g and BACKEND_MEM_LIMIT_MB=3072 in .env instead of
    # editing this file.
    mem_limit: ${BACKEND_MEM_LIMIT:-8g}
    env_file: .env
    environment:
      PORT: "8000"
      # The other half of the contract above. Passed in rather than discovered:
      # a process cannot portably read its own cgroup limit (the file moved
      # between cgroup v1 and v2, and reads "max" when unset -- which is the
      # state this replaces, so a self-discovering backend would have learned
      # nothing on the very deployment that needed it most).
      BACKEND_MEM_LIMIT_MB: "${BACKEND_MEM_LIMIT_MB:-8192}"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: talking_to_air_memory
      DB_USER: postgres
      # Which peers uvicorn's --proxy-headers will believe about the client's
      # real address. Scoped to Docker's private bridge range, which is the
      # only hop in front of this service (nginx, in the frontend container).
      #
      # This is what makes per-IP rate limiting mean anything: without it the
      # default trusts 127.0.0.1 only, nginx connects from a bridge address,
      # X-Forwarded-For is discarded, and every request in the stack is
      # attributed to nginx -- one shared bucket for the whole userbase.
      #
      # Deliberately NOT "*". uvicorn walks the forwarded chain in reverse and
      # stops at the first peer it does not trust, so a narrow range yields the
      # real client even when the client sent its own X-Forwarded-For. With "*"
      # it takes the leftmost entry instead, which the client fully controls --
      # anyone could mint a fresh rate-limit bucket per request.
      #
      # The default is Docker's conventional pool, which is what this stack gets
      # on a stock daemon. It is overridable because the pool is configurable in
      # daemon.json: a host allocating from, say, 10.10.0.0/16 puts nginx outside
      # this range, uvicorn then drops X-Forwarded-For, and per-address limiting
      # silently collapses to one bucket for every anonymous visitor. api.py logs
      # a warning the first time it sees that happen, so the symptom is at least
      # findable; this is the knob that fixes it.
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-172.16.0.0/12}"
    # No `ports:` on purpose. The backend is reachable only over the compose
    # network, as backend:8000, which is how nginx already reaches it -- so
    # dropping the host mapping changes nothing about how the app works.
    #
    # What it changes is that there is now exactly one way in. A published
    # 8000, even on loopback, is a second door that bypasses the edge: nginx's
    # limit_req and the X-Forwarded-For handling above only see traffic that
    # went through nginx, so a request to :8000 skips rate limiting entirely
    # and arrives with whatever forwarded headers it cares to claim. On a
    # developer's machine "loopback only" mostly contains that; on a host that
    # is the deployment it also exposes it to anything else sharing the host,
    # and to any container publishing on the same interface.
    #
    # `docker compose exec backend curl localhost:8000/health` covers the
    # debugging the mapping used to, and docker-compose.debug.yml re-publishes
    # it on loopback when you want a browser pointed at /docs:
    #   docker compose -f docker-compose.yml -f docker-compose.debug.yml up
    volumes:
      - plot_outputs:/app/outputs
      # Server-rendered map overlay PNGs (T23). Kept OUT of /app/outputs on
      # purpose (that dir is served unauthenticated at /outputs), so it needs
      # its own named volume — without one, a container recreate wipes every
      # overlay while its chart payload persists in Postgres, and the map
      # silently degrades to the canvas fallback ("quality lowered on restart").
      - overlay_store:/app/overlay_store
      # T52 Zarr cube cache — the open pipeline's output, keyed so it self-
      # invalidates. Backend-only and read-write, same posture as
      # overlay_store. Deliberately NOT a tempdir: a cube costs minutes to
      # build and this image is rebuilt constantly, so a tempdir store would
      # be empty every time you looked and would read as "the cache doesn't
      # help" rather than as a missing volume. Bounded by CUBE_STORE_MAX_BYTES,
      # not by free space.
      - cube_store:/app/cube_store
      # T59 frame blob store — the float32 stack behind a chart's time
      # scrubber. Its own volume rather than a corner of overlay_store, which
      # has no eviction policy and grows forever: an LRU sweeper sharing a
      # directory with an unbounded store would evict frames to make room for
      # PNGs that never leave. Bounded by FRAME_STORE_MAX_BYTES (1 GiB), not by
      # free space. Without a volume, a container recreate strips the scrubber
      # off every chart ever plotted while the frame axis persists in Postgres
      # and goes on advertising it — and D8 forbids rebuilding the blob.
      - frame_store:/app/frame_store
      # earthdata-retrieval MCP's materialization volume, read-only, mounted
      # at the same absolute path (/data) the MCP stack uses internally so
      # `export_result`'s file:// URIs resolve as a plain filesystem read.
      - earthdata_data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - earthdata_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Backend tests (pytest + coverage) ───────────────────────────────────────
  #  Run with: docker compose --profile test run --rm backend-test
  backend-test:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      # `devtools`, not `builder`: pytest/coverage live only in that stage so
      # they stay out of the runtime image's venv.
      target: devtools
    profiles: ["test"]
    working_dir: /app
    environment:
      SUPABASE_URL: "https://test-project.supabase.co"
      SUPABASE_PUBLISHABLE_KEY: "test-publishable-key"
      GROQ_API_KEY: "test"
      AQS_API_KEY: "test"
      AQS_API_EMAIL: "test@test.com"
      DB_HOST: "localhost"
      DB_PORT: "5432"
      DB_NAME: "talking_to_air_memory"
      DB_USER: "postgres"
      DB_PASSWORD: "test"
    volumes:
      # test_chart_repository.py's / test_artifact_repository.py's schema-contract
      # tests read these files straight off disk; they live at the repo root so
      # they're outside the ./Backend build context and must be bind-mounted in.
      - ./sql/init_agent_charts.sql:/sql/init_agent_charts.sql:ro
      - ./sql/init_agent_artifacts.sql:/sql/init_agent_artifacts.sql:ro
      # test_overlay_store_persistence.py asserts the deployment persists the
      # overlay store; the compose file is likewise outside the build context.
      - ./docker-compose.yml:/compose/docker-compose.yml:ro
      # The Python-reads-JS contract tests. Neither side can import the other,
      # so a concept living on both sides of the seam is enforced by reading the
      # literal out of the JS source: FinishedRowStatusContractTests against
      # jobCard.js's TERMINAL_STATUSES, and SharedDeltaThresholdTests (T59
      # Phase 8) against frameDelta.js's severityOf edge, which is the same
      # number as _DELTA_HIGH. Both resolve the file relative to Backend/tests,
      # so the mount lands at the absolute path that resolution produces in the
      # container and the same expression works on the host. ./Frontend is
      # outside the ./Backend build context, same as the two SQL files above —
      # and without this mount those tests fail on a missing file rather than on
      # a drift, which is exactly what jobCard.js's had been doing.
      - ./Frontend/src/utils:/Frontend/src/utils:ro
      # test_deployment_contract.py reads the frontend's build and TLS config to
      # assert the image stays buildable from a clean checkout. Same reason as
      # the mounts above: ./Frontend is outside the ./Backend build context, so
      # without these the tests fail on a missing file rather than on a drift.
      # test_deployment_contract.py reads each of these to assert a deployment
      # invariant that is otherwise checked by nothing: that the frontend image
      # builds from a clean checkout, that the backend publishes no host port,
      # that both images carry a pushable tag, and that the `external` network
      # and volume have a provisioner. They resolve via the same `../..`
      # expression the tests use on the host, so one expression works in both
      # places -- see the module docstring there. Mounted file-by-file rather
      # than as a whole-repo mount to keep the surface explicit; the tests
      # assert these mounts exist, so deleting one fails rather than silently
      # turning the contracts into no-ops.
      - ./Frontend/Dockerfile:/Frontend/Dockerfile:ro
      - ./Frontend/nginx.conf:/Frontend/nginx.conf:ro
      - ./Frontend/.dockerignore:/Frontend/.dockerignore:ro
      - ./Frontend/docker-entrypoint.d:/Frontend/docker-entrypoint.d:ro
      - ./docker-compose.debug.yml:/docker-compose.debug.yml:ro
      - ./scripts/provision.sh:/scripts/provision.sh:ro
      - ./.github/workflows/release.yml:/.github/workflows/release.yml:ro
      # Pins LF for the scripts a container executes; a CRLF shebang makes
      # the kernel report the script itself as 'not found'.
      - ./.gitattributes:/.gitattributes:ro
      # Same reason: .coveragerc is a repo-root file, so the image has never
      # contained it. Without it `coverage report` below ran unconfigured,
      # measured all of site-packages, and died on netCDF4's compiled extension
      # ("No source for code: /app/src/netCDF4/_netCDF4.pyx") -- so this service
      # exited 1 even when every test passed.
      - ./.coveragerc:/app/.coveragerc:ro
    command: >
      sh -c "coverage run -m pytest tests/ -v --tb=short && coverage report"

  # ── Frontend tests (Vitest) ───────────────────────────────────────────────────
  #  Run with: docker compose --profile test run --rm frontend-test
  frontend-test:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: builder
    profiles: ["test"]
    working_dir: /app
    command: ["npm", "test"]

  # ── React / Vite frontend (nginx) ────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    # Same reasoning as the backend's tag above.
    image: ${IMAGE_REGISTRY:-ghcr.io/tpatel1208}/tta-frontend:${IMAGE_TAG:-dev}
    container_name: tta-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "443:443"
    volumes:
      - plot_outputs:/usr/share/nginx/html/outputs  # serves images directly from volume
      # TLS keypair, mounted rather than baked into the image. nginx.conf reads
      # /etc/nginx/certs/tls.crt + tls.key; scripts/setup-tls.sh writes them.
      # This is what makes the frontend image buildable from a clean checkout:
      # the pair is .gitignore'd, so a COPY of it could only ever succeed on a
      # machine that had already run that script.
      - ./Frontend/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy

# ── Networks ───────────────────────────────────────────────────────────────────
# Fixed name (not project-prefixed). Join it here as external so the backend
# can reach the harmony-retrieval-mcp stack's `mcp` service at
# $EARTHDATA_MCP_URL.
#
# `external: true` means compose will NOT create this -- it refuses to start
# the stack until the network exists. Run `./scripts/provision.sh` once on a
# fresh host to create it (and earthdata_data below). That used to be the
# harmony-retrieval-mcp stack's job, which made cloning and building a second
# repo a prerequisite for starting this one at all -- including for the
# ground/EPA-only path, which never speaks to the MCP. The script is idempotent
# and labels the network so that stack still adopts it cleanly.
#
# T17: the backend no longer requires that stack to be up first (or ever, for
# ground/EPA-only use) — it boots regardless and connects to the MCP in the
# background with capped retry, healing without a restart once it's up. Bring
# up this stack and the harmony-retrieval-mcp stack in either order; see
# README.md.
networks:
  earthdata_net:
    external: true

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  pg_data:
    driver: local
  plot_outputs:
    driver: local
  overlay_store:
    driver: local
  cube_store:
    driver: local
  frame_store:
    driver: local
  # The harmony-retrieval-mcp stack's `data` volume (fixed name
  # `earthdata_data`); joined here as external, read-only, so this stack is
  # not a second writer of materialized data. Like earthdata_net above,
  # `external: true` means compose will not create it -- `./scripts/provision.sh`
  # does. It starts empty, which is the correct state with no MCP running: the
  # backend boots anyway (T17) and the ground/EPA path works.
  earthdata_data:
    external: true
