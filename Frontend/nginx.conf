server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Images: /api/outputs/* → backend /outputs/*
    location /api/outputs/ {
        proxy_pass         http://backend:8000/outputs/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 30s;
    }

    # All other API calls: /api/* → backend /*
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # SPA fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built JS/CSS assets. Safe to keep forever because Vite content-
    # hashes the filenames -- a new build produces a new name.
    location ~* \.(js|css|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached, or the pair above becomes a trap: the
    # browser keeps an old index.html, that document names the old hashed
    # bundle, and the bundle is held "immutable" for a year -- so the app boots
    # entirely from disk cache and never makes a request that could discover a
    # new build. Observed 2026-08-02: both containers were rebuilt and correct,
    # yet the browser kept rendering the previous release.
    #
    # "no-cache" means revalidate before use, not "don't store": the ETag below
    # still turns an unchanged document into a 304, so this costs one
    # conditional request per load, not a re-download.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}