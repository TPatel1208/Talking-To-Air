# Two zones, not one. Image traffic is bursty by nature -- a multi-panel map
# fetches one PNG per panel, and opening a thread fetches one per chart -- so
# sharing a zone with the API calls driving the page means ordinary use trips a
# limit meant for abuse. Both image routes below point at the roomier bucket:
# the chat plots under /api/outputs/, and the server-rendered map overlays,
# which are served from an authenticated chart route rather than /outputs/ and
# so need their own location to avoid falling through to /api/.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=asset_limit:10m rate=60r/s;

# 503 is nginx's default here and it is the wrong code: this stack already
# returns 503 for two real outages -- the auth middleware's "identity provider
# unavailable" and T17's MCP readiness gate -- so a throttled client would be
# indistinguishable from a backend that is genuinely down, and the frontend's
# outage handling would fire on what is really backpressure. 429 also matches
# what the application-level limiter returns, so a client sees one code for
# "too fast" whichever layer produced it.
limit_req_status 429;

server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
    
}
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/localhost+2.pem;
    ssl_certificate_key /etc/nginx/localhost+2-key.pem;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Images: /api/outputs/* → backend /outputs/*
    location /api/outputs/ {
        limit_req zone=asset_limit burst=60 nodelay;
        proxy_pass         http://backend:8000/outputs/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 30s;
    }

    # Map overlays: /api/chart/<id>/overlay.png → backend /chart/<id>/overlay.png
    # A regex location, which nginx matches ahead of the /api/ prefix below, so
    # these land in asset_limit instead of spending the API budget. proxy_pass
    # cannot carry a URI in a regex location, hence the rewrite to strip /api.
    location ~ ^/api/chart/[^/]+/overlay\.png$ {
        limit_req zone=asset_limit burst=60 nodelay;
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # All other API calls: /api/* → backend /*
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # SPA fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built JS/CSS assets. Safe to keep forever because Vite content-
    # hashes the filenames -- a new build produces a new name.
    location ~* \.(js|css|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached, or the pair above becomes a trap: the
    # browser keeps an old index.html, that document names the old hashed
    # bundle, and the bundle is held "immutable" for a year -- so the app boots
    # entirely from disk cache and never makes a request that could discover a
    # new build. Observed 2026-08-02: both containers were rebuilt and correct,
    # yet the browser kept rendering the previous release.
    #
    # "no-cache" means revalidate before use, not "don't store": the ETag below
    # still turns an unchanged document into a 304, so this costs one
    # conditional request per load, not a re-download.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

}