name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      # Must match Backend/Dockerfile's base image (python:3.12-bullseye) â€”
      # CI is worthless as a gate if it runs the suite on an interpreter we
      # don't ship. Backend/ruff.toml, Backend/mypy.ini and pyproject.toml's
      # requires-python all say 3.12 too; keep all five in step.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libproj-dev proj-data proj-bin libgeos-dev \
            libgdal-dev gdal-bin libhdf5-dev libnetcdf-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements-dev.txt
          pip install -e Backend

      - name: Lint Python syntax
        run: python -m compileall -q Backend

      - name: Lint Python style
        run: python -m ruff check Backend/

      - name: Type check selected backend packages
        run: python -m mypy Backend/tta_backend/services/ Backend/tta_backend/repositories/ Backend/tta_backend/models/ --ignore-missing-imports --config-file Backend/mypy.ini

      # pytest, not `unittest discover`: the suite's bootstrap lives in
      # Backend/conftest.py, which only pytest loads. Under unittest CI ran
      # without it and paid for it three ways:
      #   * no `_isolate_tool_cache` â€” T53's tool cache is process-global, so one
      #     test's search_datasets(query="no2") was served to the next test's
      #     identical call and that test's handler never ran;
      #   * no marker exclusions â€” pyproject's `-m "not eval and not live_mcp"`
      #     is pytest config, so CI had no idea eval/live_mcp tests exist;
      #   * no plain pytest-style tests â€” unittest only collects TestCase
      #     subclasses, so the two persistence-contract modules were invisible.
      # This is also the runner CLAUDE.md documents for the local gate, so CI and
      # `docker compose --profile test run backend-test` now check the same suite.
      - name: Run unit and integration tests with coverage
        env:
          PYTHONPATH: Backend
        run: coverage run -m pytest Backend/tests

      - name: Coverage report
        env:
          PYTHONPATH: Backend
        run: coverage report
      - name: Build backend Docker image
        run: |
           touch .env
           docker compose build backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Lint frontend
        working-directory: Frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: Frontend
        run: npm test

      - name: Build frontend bundle
        working-directory: Frontend
        run: npm run build

      # Frontend/Dockerfile COPYs a cert/key pair for nginx's TLS listener.
      # Devs generate a real mkcert-trusted one via scripts/setup-tls.sh, but
      # that trust step is meaningless in CI (no browser ever loads this
      # image) -- CI just needs *a* file at that path for COPY to succeed, so
      # a throwaway self-signed pair is enough.
      - name: Generate throwaway TLS cert for the Docker build
        working-directory: Frontend
        run: |
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout localhost+2-key.pem -out localhost+2.pem \
            -subj "/CN=localhost"

      - name: Build frontend Docker image
        env:
          DB_PASSWORD: ci-placeholder
        run: docker compose build frontend
